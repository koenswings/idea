<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="260" viewBox="0 0 1100 260"><defs></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="550" y="28.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#111">Preparing many micro-SD cards</text><rect x="15" y="60" width="195" height="150" rx="8" fill="#eef5ff" stroke="#333" stroke-width="2"/><text x="112" y="90.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">1. Get the IDEA image</text><text x="112" y="125.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">idea-client-26.04-&lt;date&gt;.img.xz</text><text x="112" y="138.125" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">from the IDEA team</text><text x="112" y="151.25" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">+ check SHA-256</text><polyline points="212,135 216.6,135.0" fill="none" stroke="#1f77b4" stroke-width="4" stroke-linejoin="round" stroke-linecap="butt"/><polygon points="231,135 215.0,141.4 215.0,128.6" fill="#1f77b4"/><rect x="233" y="60" width="195" height="150" rx="8" fill="#fff7e0" stroke="#333" stroke-width="2"/><text x="330" y="90.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">2. Write each card</text><text x="330" y="125.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">Raspberry Pi Imager</text><text x="330" y="138.125" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">'Use custom' -&gt; the .img.xz</text><text x="330" y="151.25" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">(about 10 min/card)</text><polyline points="430,135 434.6,135.0" fill="none" stroke="#1f77b4" stroke-width="4" stroke-linejoin="round" stroke-linecap="butt"/><polygon points="449,135 433.0,141.4 433.0,128.6" fill="#1f77b4"/><rect x="451" y="60" width="195" height="150" rx="8" fill="#f4f4f4" stroke="#333" stroke-width="2"/><text x="548" y="90.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">3. Home Engine (optional)</text><text x="548" y="125.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">idea-home.txt on the</text><text x="548" y="138.125" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">boot partition:</text><text x="548" y="151.25" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">the Engine's sticker name</text><polyline points="648,135 652.6,135.0" fill="none" stroke="#1f77b4" stroke-width="4" stroke-linejoin="round" stroke-linecap="butt"/><polygon points="667,135 651.0,141.4 651.0,128.6" fill="#1f77b4"/><rect x="669" y="60" width="195" height="150" rx="8" fill="#f0fff0" stroke="#333" stroke-width="2"/><text x="766" y="90.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">4. First boot</text><text x="766" y="125.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">Pi 400 or Pi 500:</text><text x="766" y="138.125" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">no wizard, learner</text><text x="766" y="151.25" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">logs in by itself</text><polyline points="866,135 870.6,135.0" fill="none" stroke="#1f77b4" stroke-width="4" stroke-linejoin="round" stroke-linecap="butt"/><polygon points="885,135 869.0,141.4 869.0,128.6" fill="#1f77b4"/><rect x="887" y="60" width="195" height="150" rx="8" fill="#fff0f0" stroke="#333" stroke-width="2"/><text x="984" y="90.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">5. Check + label</text><text x="984" y="125.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">IDEA icon opens the</text><text x="984" y="138.125" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">Console; label the PC</text><text x="984" y="151.25" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#111">with its idea-pc name</text><text x="550" y="240.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#555">One image for every Pi 400 and Pi 500. A card can move between the two models.</text></svg>