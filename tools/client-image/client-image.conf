# IDEA student client image - build configuration (proposal idea#201, §9).
# Committed. NO secrets here: see secrets.env.example (kept outside git).
BASE_VERSION="26.04.1"
BASE_IMAGE="ubuntu-26.04.1-preinstalled-desktop-arm64+raspi.img.xz"
BASE_URL="https://cdimage.ubuntu.com/ubuntu/releases/26.04/release"
# Pinned from Ubuntu's SHA256SUMS; build also re-checks against the live SHA256SUMS when online.
BASE_SHA256="8216f54cc1df2fcf7de37530a7edccdd200abd7dcfbc5d4f0407df7513544d6a"

LOCALE="en_GB.UTF-8"
TIMEZONE="Africa/Harare"
KEYBOARD_LAYOUT="gb"          # per-school kit: gb, us, ...
KEYBOARD_VARIANT=""
WIFI_SSID="IDEA"              # PSK comes from secrets
OVERLAY="off"                 # reset level B: on|off (off in v1)
HOSTNAME_PREFIX="idea-pc"

PACKAGES_OFFICE="libreoffice-writer libreoffice-calc libreoffice-impress libreoffice-gtk3 fonts-crosextra-carlito fonts-crosextra-caladea"
PACKAGES_BROWSER="chromium"   # .deb from ppa:xtradeb/apps (Ubuntu ships Chromium only as a snap; no Chrome for arm64)
PACKAGES_EDU="gcompris-qt tuxpaint tuxmath tuxtype kturtle kalzium marble stellarium"
PACKAGES_GAMES="supertuxkart gnome-chess stockfish gnome-mines gnome-sudoku aisleriot quadrapassel"
PACKAGES_SYSTEM="overlayroot zram-tools openssh-server hunspell-en-gb"
PACKAGES_REMOVE="unattended-upgrades update-notifier update-notifier-common update-manager ubuntu-advantage-tools ubuntu-pro-client thunderbird snap-store gnome-software apport whoopsie fwupd gnome-initial-setup"

# --- Server addressing: the ONLY place clients learn where the servers are. ---
# How clients find servers when several are on one network is a separate follow-up proposal;
# until then these are fixed URLs. They are written to /etc/idea-client/servers.conf in the image and
# every bookmark, desktop icon and menu entry is generated from them (change here, rebuild).
SERVER_HOST="10.42.0.2"
URL_CONSOLE="http://${SERVER_HOST}/"
URL_KOLIBRI="http://${SERVER_HOST}:8080/"
URL_NEXTCLOUD="http://${SERVER_HOST}:8081/"
URL_KIWIX="http://${SERVER_HOST}:8082/"
URL_SCRATCH="http://${SERVER_HOST}/scratch/"
URL_GEOGEBRA="http://${SERVER_HOST}/geogebra/"
