# IDEA student client image - build configuration (proposal idea#201, §9).
# Committed. NO secrets here: see secrets.env.example (kept outside git).
BASE_VERSION="26.04.1"
BASE_IMAGE="ubuntu-26.04.1-preinstalled-desktop-arm64+raspi.img.xz"
BASE_URL="https://cdimage.ubuntu.com/ubuntu/releases/26.04/release"
# Pinned from Ubuntu's SHA256SUMS; build also re-checks against the live SHA256SUMS when online.
BASE_SHA256="8216f54cc1df2fcf7de37530a7edccdd200abd7dcfbc5d4f0407df7513544d6a"

LOCALE="en_GB.UTF-8"
TIMEZONE="UTC"                # image default, no country zone (idea#208); the school zone is set at flash time (set-card-timezone.sh / Engine Flash)
KEYBOARD_LAYOUT="us"          # per-school kit: gb, us, ...
# Locale stays en_GB.UTF-8 (dates, spelling, A4); it is independent of the keyboard layout.
KEYBOARD_VARIANT=""
WIFI_SSID="IDEA"              # PSK comes from secrets
OVERLAY="on"                  # reset-on-reboot: on|off. on = armed once after first boot (idea-overlay-arm); field switch: sudo idea-client-mode normal|overlay
# Raw image size cap (idea#202): smallest "16 GB" card seen holds 15,931,539,456 bytes. Root grows on first boot.
MAX_IMAGE_BYTES=14000000000
ROOT_FREE_MB=3072              # free space wanted inside the shrunk root fs
ROOT_FREE_MIN_MB=2048          # if +ROOT_FREE_MB does not fit MAX_IMAGE_BYTES, cut to the cap while at least this stays free (s16, idea#322)
HOSTNAME_PREFIX="idea-pc"
ADMIN_USER="admin"           # local password = "${ADMIN_USER}911!" (documented convention, not a secret; SSH stays key-only)

PACKAGES_OFFICE="libreoffice-writer libreoffice-calc libreoffice-impress libreoffice-gtk3 fonts-crosextra-carlito fonts-crosextra-caladea"
# --- Browser (proposal idea#203 §1). Default: Google Chrome stable, official arm64 .deb, installed offline,
# Google repo removed, package held. Fallback: build.sh --browser chromium (xtradeb PPA .deb, same policies).
BROWSER="chrome"
CHROME_DEB="google-chrome-stable_155.0.8059.79-1_arm64.deb"
CHROME_DEB_URL="https://dl.google.com/linux/chrome/deb/pool/main/g/google-chrome-stable/${CHROME_DEB}"
CHROME_DEB_SHA256="245fa8da4a52c15bee7811d3e17892792cabd6361ac5b7e9c78ba6482ad18315"   # recorded 2026-10-15
PACKAGES_EDU="gcompris-qt tuxpaint tuxmath tuxtype kturtle kalzium marble stellarium"
PACKAGES_GAMES="supertuxkart gnome-chess stockfish gnome-mines gnome-sudoku aisleriot quadrapassel"
PACKAGES_SYSTEM="overlayroot zram-tools openssh-server hunspell-en-gb curl gnome-screenshot"   # gnome-screenshot: first-login acceptance screenshots
PACKAGES_REMOVE="unattended-upgrades update-notifier update-notifier-common update-manager ubuntu-advantage-tools ubuntu-pro-client thunderbird snap-store gnome-software apport whoopsie fwupd gnome-initial-setup"

# --- Server addressing: NONE in the image (proposal idea#203 §2-§3). The one "IDEA" shortcut opens
# file:///usr/share/idea/start.html, which tries the home Engine (idea-home.txt on the boot partition, written by the
# Engine's Flash step), then the last name that worked, then http://idea.local. No Engine name or IP is baked in.
