# IDEA Engine image - build configuration (idea#322 stage 5, Steve's Option A: chroot builder). Committed, NO secrets.
# Base: Raspberry Pi OS Lite arm64 (trixie), pinned by URL + sha256 (from the vendor's .sha256 file, recorded 2026-10-29).
BASE_IMAGE="2026-10-06-raspios-trixie-arm64-lite.img.xz"
BASE_URL="https://downloads.raspberrypi.com/raspios_lite_arm64/images/raspios_lite_arm64-2026-10-06"
BASE_SHA256="483db18a48da399b5b7022ffae9a07bc6d99daab30e593aedac09b69ff422843"
EXTRA_MB=6144                   # room added to the root fs before the Engine build (Docker images are preloaded)
# Raw image cap (same "16 GB" card rule as the client, idea#202) and shrink headroom; root grows on first boot.
MAX_IMAGE_BYTES=14000000000
ROOT_FREE_MB=1024
ROOT_FREE_MIN_MB=512
# GitHub release-file limit (proposal 2026-10-27 "2 GB", GitHub's real limit is 2 GiB). Decision 6 (split or lean)
# is taken at the first real Engine release: until then a release over the limit is refused, a proof only records it.
RELEASE_FILE_LIMIT_BYTES=2147483648
